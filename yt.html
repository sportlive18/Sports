<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>Universal Player · YouTube + HLS + MP4</title>

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    :root { --plyr-color-main: #0078e8; }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app-container {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .player-container {
      display: none;
      width: 100%; height: 100%;
      position: relative;
    }
    .player-container.active { display: block; }

    .video-wrapper {
      position: relative;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* Make sure whatever player element is injected fills the wrapper */
    .video-wrapper > video,
    .video-wrapper > div:not(.loading-overlay):not(.error-message) {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .video-wrapper .plyr,
    .video-wrapper .plyr__video-wrapper,
    .video-wrapper iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 30; color: #fff;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--plyr-color-main);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error message */
    .error-message {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 28px;
      background: rgba(180,0,0,0.95);
      border-radius: 12px;
      text-align: center; z-index: 99;
      color: white; font-size: 1.1rem;
      max-width: 85%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .error-message h2 { margin: 0 0 8px; font-size: 1.3rem; }

    /* URL panel */
    .url-panel {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      border: 1px solid #333;
      border-radius: 24px;
      padding: 28px 24px;
      width: 90%; max-width: 560px;
      z-index: 200;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      text-align: center; color: #eee;
    }
    .url-panel.hidden { display: none; }
    .url-panel h2 { margin: 0 0 16px; font-size: 1.6rem; color: #fff; font-weight: 500; }
    .url-panel p { font-size: 0.95rem; opacity: 0.75; margin: 0 0 24px; }
    .url-panel input {
      width: 100%; padding: 14px 18px;
      border-radius: 40px;
      border: 1px solid #444;
      background: #222; color: #fff;
      font-size: 1rem; outline: none;
      margin-bottom: 18px;
    }
    .url-panel input:focus { border-color: var(--plyr-color-main); }
    .url-panel button {
      background: var(--plyr-color-main);
      border: none; color: white;
      padding: 14px 32px;
      border-radius: 40px;
      font-size: 1.1rem; font-weight: 600;
      cursor: pointer; width: 100%;
      transition: background 0.15s;
    }
    .url-panel button:hover { background: #0066cc; }
    .url-panel button:active { transform: scale(0.98); }

    .example-links {
      margin-top: 20px;
      display: flex; flex-wrap: wrap;
      gap: 8px; justify-content: center;
      font-size: 0.8rem; opacity: 0.7;
    }
    .example-links span {
      background: #2a2a2a;
      padding: 5px 14px;
      border-radius: 30px;
      cursor: pointer;
    }
    .example-links span:hover { background: #3a3a3a; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="player-container" id="playerContainer">
    <div class="video-wrapper" id="videoWrapper">
      <!-- Player element is injected here dynamically -->
      <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading stream...</p>
      </div>
    </div>
  </div>

  <div class="url-panel" id="urlPanel">
    <h2>🎬 Universal Player</h2>
    <p>Paste a YouTube link, .m3u8 stream, or MP4 URL</p>
    <input type="text" id="videoUrlInput" placeholder="https://youtu.be/... or https://example.com/stream.m3u8" autofocus>
    <button id="loadBtn">▶ Load video</button>
    <div class="example-links">
      <span data-example="https://www.youtube.com/watch?v=dQw4w9WgXcQ">▶ YouTube</span>
      <span data-example="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">▶ HLS</span>
      <span data-example="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">▶ MP4</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.min.js"></script>

<script>
(function () {
  'use strict';

  // ---------- DOM ----------
  const playerContainer = document.getElementById('playerContainer');
  const videoWrapper    = document.getElementById('videoWrapper');
  const urlPanel        = document.getElementById('urlPanel');
  const urlInput        = document.getElementById('videoUrlInput');
  const loadBtn         = document.getElementById('loadBtn');
  const loadingOverlay  = document.getElementById('loadingOverlay');

  // ---------- STATE ----------
  let plyr     = null;   // Plyr instance
  let hls      = null;   // Hls instance
  let playerEl = null;   // current player element (video OR div)

  // ---------- HELPERS ----------
  function showLoading(show) {
    loadingOverlay.classList.toggle('hidden', !show);
  }

  function clearError() {
    const err = videoWrapper.querySelector('.error-message');
    if (err) err.remove();
  }

  function displayError(msg) {
    showLoading(false);
    clearError();
    const div = document.createElement('div');
    div.className = 'error-message';
    div.innerHTML = '<h2>⚠️ Stream Error</h2><p>' + msg + '</p>';
    videoWrapper.appendChild(div);
  }

  // Destroy ANY previous player + remove element from DOM
  function cleanupPlayer() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    if (plyr) { try { plyr.destroy(); } catch (e) {} plyr = null; }
    if (playerEl && playerEl.parentNode) playerEl.parentNode.removeChild(playerEl);
    playerEl = null;
    clearError();
  }

  // ---------- YouTube ID extractor ----------
  function getYouTubeID(url) {
    if (!url) return null;
    const u = url.trim();
    let m;
    m = u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);       if (m) return m[1];
    m = u.match(/\/shorts\/([A-Za-z0-9_-]{11})/);        if (m) return m[1];
    m = u.match(/\/live\/([A-Za-z0-9_-]{11})/);          if (m) return m[1];
    m = u.match(/\/embed\/([A-Za-z0-9_-]{11})/);         if (m) return m[1];
    m = u.match(/[?&]v=([A-Za-z0-9_-]{11})/);            if (m) return m[1];
    return null;
  }

  function isHls(url) {
    return url && url.toLowerCase().includes('.m3u8');
  }

  // ---------- MAIN LOADER ----------
  function loadVideo(rawUrl) {
    if (!rawUrl) return;
    const url = rawUrl.trim();
    if (!url) return;

    urlPanel.classList.add('hidden');
    playerContainer.classList.add('active');

    // Always fully clean up first
    cleanupPlayer();

    const ytId     = getYouTubeID(url);
    const isHlsUrl = isHls(url);

    /* ============ YOUTUBE ============ */
    if (ytId) {
      showLoading(false);

      // YouTube needs a <div>, NOT a <video>
      playerEl = document.createElement('div');
      playerEl.id = 'ytPlayer';
      playerEl.style.width  = '100%';
      playerEl.style.height = '100%';
      // Insert BEFORE the loading overlay so overlay stays on top
      videoWrapper.insertBefore(playerEl, loadingOverlay);

      plyr = new Plyr(playerEl, {
        autoplay: true,
        muted: true,
        clickToPlay: false,
        controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'],
        settings: ['speed'],
        youtube: {
          noCookie: true,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          modestbranding: 1
        }
      });

      // Tell Plyr to load YouTube source
      plyr.source = {
        type: 'video',
        sources: [{
          src: ytId,
          provider: 'youtube'
        }]
      };
      return;
    }

    /* ============ HLS (.m3u8) ============ */
    if (isHlsUrl && window.Hls && Hls.isSupported()) {
      showLoading(true);

      playerEl = document.createElement('video');
      playerEl.id = 'hlsVideo';
      playerEl.setAttribute('playsinline', '');
      playerEl.setAttribute('controls', '');
      playerEl.setAttribute('crossorigin', 'anonymous');
      videoWrapper.insertBefore(playerEl, loadingOverlay);

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 90
      });

      hls.loadSource(url);
      hls.attachMedia(playerEl);

      hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
        const levels = data.levels || [];
        const heights = levels.map(function (l) { return l.height; }).filter(Boolean);
        const uniqueHeights = Array.from(new Set(heights)).sort(function (a, b) { return b - a; });
        const qualityOptions = [0].concat(uniqueHeights); // 0 = Auto
        const defaultQ = uniqueHeights.indexOf(720) !== -1 ? 720 : 0;

        if (plyr) { try { plyr.destroy(); } catch (e) {} }
        plyr = new Plyr(playerEl, {
          autoplay: true,
          playsinline: true,
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
          settings: ['quality', 'speed', 'captions'],
          speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
          quality: {
            default: defaultQ,
            options: qualityOptions,
            forced: true,
            onChange: function (newQ) {
              if (!hls) return;
              showLoading(true);
              if (newQ === 0) {
                hls.currentLevel = -1;
              } else {
                const idx = hls.levels.findIndex(function (l) { return l.height === newQ; });
                if (idx !== -1) hls.currentLevel = idx;
              }
            }
          }
        });

        // Hide loader on playback events
        plyr.on('playing', function () { showLoading(false); });
        plyr.on('canplay', function () { showLoading(false); });
        plyr.on('waiting', function () { showLoading(true); });
        plyr.on('error',   function () { displayError('Playback error. Check the stream URL.'); });

        // HLS level switched → hide loader
        hls.on(Hls.Events.LEVEL_SWITCHED, function () { showLoading(false); });

        playerEl.play().catch(function (e) { console.warn('Autoplay blocked:', e); });
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (!data.fatal) return;
        console.error('HLS fatal error:', data);
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            displayError('Network error – cannot load HLS stream.');
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            displayError('Media error – the stream may be corrupted.');
            break;
          default:
            displayError('HLS error: ' + (data.details || 'unknown'));
        }
        if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
      });

      return;
    }

    /* ============ MP4 / DIRECT FILE ============ */
    showLoading(false);

    playerEl = document.createElement('video');
    playerEl.id = 'fileVideo';
    playerEl.setAttribute('playsinline', '');
    playerEl.setAttribute('controls', '');
    playerEl.setAttribute('crossorigin', 'anonymous');
    playerEl.src = url;
    videoWrapper.insertBefore(playerEl, loadingOverlay);

    plyr = new Plyr(playerEl, {
      autoplay: true,
      playsinline: true,
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
      settings: ['speed'],
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] }
    });

    playerEl.addEventListener('error', function () {
      displayError('Failed to load video. Unsupported format or network issue.');
    });

    playerEl.play().catch(function (e) { console.warn('Autoplay blocked:', e); });
  }

  // ---------- INIT FROM QUERY PARAMS ----------
  function initFromQuery() {
    const params = new URLSearchParams(window.location.search);
    let url = params.get('url') || params.get('ios');

    if (url) {
      try { url = decodeURIComponent(url); } catch (e) {}
      urlPanel.classList.add('hidden');
      playerContainer.classList.add('active');
      // Wait a tick so DOM is ready
      setTimeout(function () { loadVideo(url); }, 50);
    } else {
      urlPanel.classList.remove('hidden');
      playerContainer.classList.remove('active');
      showLoading(false);
      setTimeout(function () { if (urlInput) urlInput.focus(); }, 200);
    }
  }

  // ---------- EVENTS ----------
  loadBtn.addEventListener('click', function () {
    const url = urlInput.value.trim();
    if (!url) { alert('Please enter a URL'); return; }
    try {
      const u = new URL(window.location);
      u.searchParams.set('url', url);
      window.history.pushState({}, '', u);
    } catch (e) {}
    loadVideo(url);
  });

  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); loadBtn.click(); }
  });

  document.querySelectorAll('.example-links span').forEach(function (el) {
    el.addEventListener('click', function () {
      urlInput.value = el.getAttribute('data-example');
      loadBtn.click();
    });
  });

  window.addEventListener('popstate', initFromQuery);

  window.addEventListener('beforeunload', function () {
    if (hls) { try { hls.destroy(); } catch (e) {} }
    if (plyr) { try { plyr.destroy(); } catch (e) {} }
  });

  // ---------- START ----------
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFromQuery);
  } else {
    initFromQuery();
  }
})();
</script>

</body>
</html>
