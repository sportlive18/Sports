<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>Universal Player · YouTube + HLS</title>

  <!-- Plyr CSS (same for both) -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <!-- Font Awesome for icons (optional, helps with controls) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    /* ----- GLOBAL RESET & LAYOUT ----- */
    :root {
      --plyr-color-main: #0078e8;
      --bg-dark: #000;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    /* Unified video wrapper – both plyr and raw video fill this */
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Plyr / video element occupies full wrapper */
    .plyr,
    .video-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ----- LOADING OVERLAY (used for HLS) ----- */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 1;
      transition: opacity 0.3s ease;
      color: #fff;
      pointer-events: none;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--plyr-color-main);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ----- ERROR MESSAGE BOX (overlay) ----- */
    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 28px;
      background-color: rgba(180, 0, 0, 0.95);
      border-radius: 12px;
      text-align: center;
      z-index: 99;
      color: white;
      font-size: 1.1rem;
      max-width: 85%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .error-message h2 {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.3rem;
    }

    .error-message code {
      background: rgba(0,0,0,0.4);
      padding: 2px 8px;
      border-radius: 16px;
      font-size: 0.9rem;
      word-break: break-all;
    }

    /* ----- INLINE URL INPUT PANEL (appears when no URL) ----- */
    .url-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      border: 1px solid #333;
      border-radius: 24px;
      padding: 28px 24px;
      width: 90%;
      max-width: 560px;
      z-index: 200;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      text-align: center;
      color: #eee;
      backdrop-filter: blur(6px);
    }

    .url-panel h2 {
      font-weight: 500;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.6rem;
      color: #fff;
    }

    .url-panel p {
      font-size: 0.95rem;
      opacity: 0.75;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .url-panel input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 40px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.15s;
      margin-bottom: 18px;
    }

    .url-panel input:focus {
      border-color: var(--plyr-color-main);
    }

    .url-panel button {
      background: var(--plyr-color-main);
      border: none;
      color: white;
      padding: 14px 32px;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .url-panel button:hover {
      background: #0066cc;
    }

    .url-panel button:active {
      transform: scale(0.98);
    }

    .url-panel .example-links {
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.6;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .url-panel .example-links span {
      background: #2a2a2a;
      padding: 4px 12px;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .url-panel .example-links span:hover {
      background: #3a3a3a;
    }

    /* hide panel when not needed */
    .url-panel.hidden {
      display: none;
    }

    /* The main player container – hidden initially until URL exists */
    .player-container {
      width: 100%;
      height: 100%;
      display: none; /* shown via JS */
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Player container (holds either video or div for plyr) -->
  <div class="player-container" id="playerContainer">
    <div class="video-wrapper" id="videoWrapper">
      <!-- The actual video element will be inserted via JS, or we can use static video tag -->
      <video id="plyrVideo" playsinline controls crossorigin="anonymous"></video>

      <!-- Loading overlay for HLS -->
      <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading stream...</p>
      </div>
    </div>
  </div>

  <!-- URL input panel (shown when no valid URL) -->
  <div class="url-panel" id="urlPanel">
    <h2>🎬 Universal Player</h2>
    <p>Paste a YouTube link or an <strong>.m3u8</strong> / video URL</p>
    <input type="text" id="videoUrlInput" placeholder="https://youtu.be/...  or  https://example.com/stream.m3u8" autofocus>
    <button id="loadBtn">▶ Load video</button>
    <div class="example-links">
      <span data-example="https://www.youtube.com/watch?v=dQw4w9WgXcQ">YouTube example</span>
      <span data-example="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">HLS example</span>
    </div>
  </div>
</div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.min.js"></script>

<script>
(function() {
  // ---------- DOM ELEMENTS ----------
  const videoElement = document.getElementById('plyrVideo');
  const playerContainer = document.getElementById('playerContainer');
  const urlPanel = document.getElementById('urlPanel');
  const urlInput = document.getElementById('videoUrlInput');
  const loadBtn = document.getElementById('loadBtn');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const videoWrapper = document.getElementById('videoWrapper');

  // ---------- STATE ----------
  let plyr = null;              // Plyr instance
  let hls = null;              // Hls instance
  let currentSourceType = null; // 'youtube' | 'hls' | 'file'
  let currentVideoId = null;

  // ---------- HELPER: Show / hide loading overlay ----------
  function showLoading(show = true) {
    if (show) loadingOverlay.classList.remove('hidden');
    else loadingOverlay.classList.add('hidden');
  }

  // ---------- HELPER: Cleanup current player & HLS ----------
  function destroyPlayer() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
    if (plyr) {
      plyr.destroy();
      plyr = null;
    }
    // Reset video element attributes
    videoElement.removeAttribute('src');
    videoElement.removeAttribute('data-plyr-provider');
    videoElement.removeAttribute('data-plyr-embed-id');
    // Reset any inline styles
    videoElement.load(); // clear any pending media
    currentSourceType = null;
    currentVideoId = null;
  }

  // ---------- HELPER: Extract YouTube ID from URL ----------
  function extractYouTubeID(url) {
    if (!url) return null;
    // remove extra params after & or ?
    let cleanUrl = url.split('&')[0];
    cleanUrl = cleanUrl.split('?si=')[0];
    try {
      // youtu.be/ID
      if (cleanUrl.includes('youtu.be/')) {
        return cleanUrl.split('youtu.be/')[1]?.split(/[?&]/)[0] || null;
      }
      // youtube.com/live/ID
      if (cleanUrl.includes('/live/')) {
        return cleanUrl.split('/live/')[1]?.split(/[?&]/)[0] || null;
      }
      // youtube.com/shorts/ID
      if (cleanUrl.includes('/shorts/')) {
        return cleanUrl.split('/shorts/')[1]?.split(/[?&]/)[0] || null;
      }
      // standard youtube.com/watch?v=ID
      const urlObj = new URL(cleanUrl);
      const vParam = urlObj.searchParams.get('v');
      if (vParam) return vParam;
    } catch (e) {
      // fallback: try regex
      const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
      if (match && match[1]) return match[1];
    }
    return null;
  }

  // ---------- HELPER: Is this an HLS (.m3u8) URL? ----------
  function isHlsUrl(url) {
    return url && url.toLowerCase().includes('.m3u8');
  }

  // ---------- HELPER: Show error message on top of player ----------
  function displayError(message) {
    showLoading(false);
    // remove any existing error
    const existingError = document.querySelector('.error-message');
    if (existingError) existingError.remove();

    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-message';
    errorDiv.innerHTML = `
      <h2>⚠️ Stream Error</h2>
      <p>${message}</p>
    `;
    videoWrapper.appendChild(errorDiv);

    // Auto-remove after 8 seconds? Keep visible for user.
  }

  // ---------- Clear error if any ----------
  function clearError() {
    const err = document.querySelector('.error-message');
    if (err) err.remove();
  }

  // ---------- MAIN: Load video from URL ----------
  function loadVideoFromUrl(rawUrl) {
    if (!rawUrl || rawUrl.trim() === '') {
      alert('Please enter a valid URL');
      return;
    }

    // Clean URL
    const url = rawUrl.trim();

    // Hide panel, show player
    urlPanel.classList.add('hidden');
    playerContainer.style.display = 'block';

    // Destroy any previous player
    destroyPlayer();
    clearError();

    // Determine type
    const youtubeId = extractYouTubeID(url);
    const isHls = isHlsUrl(url);

    // ---------- YOUTUBE ----------
    if (youtubeId) {
      currentSourceType = 'youtube';
      currentVideoId = youtubeId;

      // Set data attributes for Plyr YouTube
      videoElement.setAttribute('data-plyr-provider', 'youtube');
      videoElement.setAttribute('data-plyr-embed-id', youtubeId);

      // Initialize Plyr with YouTube config
      plyr = new Plyr(videoElement, {
        autoplay: true,
        muted: true,
        clickToPlay: false,
        controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'],
        youtube: {
          noCookie: true,
          params: { modestbranding: 1, rel: 0, iv_load_policy: 3, playsinline: 1 }
        }
      });

      // No loading overlay for YouTube (Plyr handles it)
      showLoading(false);
      return;
    }

    // ---------- HLS (.m3u8) ----------
    if (isHls && Hls.isSupported()) {
      currentSourceType = 'hls';
      showLoading(true);

      // Ensure video element has no data-plyr attributes
      videoElement.removeAttribute('data-plyr-provider');
      videoElement.removeAttribute('data-plyr-embed-id');

      // Create HLS instance
      hls = new Hls({
        crossOrigin: 'anonymous',
        withCredentials: false,
        // Optional: start level -1 for auto
        startLevel: -1,
      });

      hls.loadSource(url);
      hls.attachMedia(videoElement);

      // Once manifest parsed, setup Plyr with quality options
      hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
        // Build quality list from levels
        const levels = data.levels;
        const heights = levels.map(l => l.height).filter(Boolean);
        const uniqueHeights = [...new Set(heights)].sort((a, b) => b - a); // descending
        const qualityOptions = [0, ...uniqueHeights]; // 0 = Auto

        // Default to 720 if available, else Auto (0)
        const defaultQuality = uniqueHeights.includes(720) ? 720 : 0;

        // Prepare Plyr config with quality
        const plyrConfig = {
          autoplay: true,
          playsinline: true,
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
          settings: ['quality', 'speed', 'captions'],
          speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
          quality: {
            default: defaultQuality,
            options: qualityOptions,
            forced: true,
            onChange: (newQuality) => {
              showLoading(true);
              if (newQuality === 0) {
                hls.currentLevel = -1; // auto
              } else {
                const levelIndex = hls.levels.findIndex(level => level.height === newQuality);
                if (levelIndex !== -1) hls.currentLevel = levelIndex;
              }
            }
          }
        };

        // Initialize Plyr
        plyr = new Plyr(videoElement, plyrConfig);

        // Hide loading when playback starts or level switched
        hls.on(Hls.Events.LEVEL_SWITCHED, () => showLoading(false));
        plyr.on('playing', () => showLoading(false));
        plyr.on('waiting', () => showLoading(true));
        plyr.on('canplay', () => showLoading(false));
        plyr.on('error', (e) => {
          console.warn('Plyr error', e);
          displayError('Playback error. Check the stream URL.');
        });

        // Attempt autoplay
        videoElement.play().catch(e => console.warn('Autoplay blocked', e));
      });

      // HLS error handling
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              displayError('Network error – could not load HLS stream.');
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              displayError('Media error – the stream may be corrupted.');
              break;
            default:
              displayError('HLS fatal error: ' + data.reason);
              break;
          }
          if (hls) {
            hls.destroy();
            hls = null;
          }
        }
      });

      return;
    }

    // ---------- DIRECT FILE (MP4, etc.) ----------
    // Fallback: treat as regular video file
    currentSourceType = 'file';
    showLoading(false);
    videoElement.removeAttribute('data-plyr-provider');
    videoElement.removeAttribute('data-plyr-embed-id');
    videoElement.src = url;

    plyr = new Plyr(videoElement, {
      autoplay: true,
      playsinline: true,
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
      settings: ['speed'],
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] }
    });

    videoElement.addEventListener('error', () => {
      displayError('Failed to load video file. Unsupported format or network issue.');
    });

    videoElement.play().catch(e => console.warn('Autoplay blocked', e));
  }

  // ---------- INIT: Check URL parameters ----------
  function initFromQueryParams() {
    const params = new URLSearchParams(window.location.search);
    // Support both ?url= and ?ios= (from original code)
    let videoUrl = params.get('url') || params.get('ios');

    if (videoUrl) {
      // Decode if needed
      try { videoUrl = decodeURIComponent(videoUrl); } catch (e) {}
      // Directly load
      urlPanel.classList.add('hidden');
      playerContainer.style.display = 'block';
      loadVideoFromUrl(videoUrl);
    } else {
      // Show input panel
      urlPanel.classList.remove('hidden');
      playerContainer.style.display = 'none';
      showLoading(false);
      // Focus input
      setTimeout(() => urlInput?.focus(), 200);
    }
  }

  // ---------- EVENT LISTENERS ----------
  // Load button
  loadBtn.addEventListener('click', () => {
    const url = urlInput.value.trim();
    if (url) {
      // Update query string without reloading
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('url', encodeURIComponent(url));
      window.history.pushState({}, '', newUrl);
      loadVideoFromUrl(url);
    } else {
      alert('Please enter a URL');
    }
  });

  // Enter key in input
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      loadBtn.click();
    }
  });

  // Example links click
  document.querySelectorAll('.example-links span').forEach(el => {
    el.addEventListener('click', () => {
      const example = el.getAttribute('data-example');
      if (example) {
        urlInput.value = example;
        loadBtn.click();
      }
    });
  });

  // Handle back/forward navigation (popstate)
  window.addEventListener('popstate', () => {
    // Reload page state based on new URL (simplest: re-init)
    initFromQueryParams();
  });

  // Cleanup on page unload
  window.addEventListener('beforeunload', () => {
    if (hls) hls.destroy();
    if (plyr) plyr.destroy();
  });

  // Start the app
  initFromQueryParams();

  // Expose a global function to load (optional)
  window.loadVideo = loadVideoFromUrl;
})();
</script>

</body>
</html>
