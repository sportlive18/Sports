<!-- ====== CHANNEL LOADER SCRIPT ====== -->
<script>
window.addEventListener('DOMContentLoaded', function () {
  var JSON_URL = 'https://sportlink-tv10.pages.dev/id.json';

  var urlParams    = new URLSearchParams(window.location.search);
  var id           = urlParams.get('id');
  var iframe       = document.getElementById('main-iframe');
  var socialBadges = document.getElementById('social-badges');
  var picker       = document.getElementById('picker');

  /* Hides the iframe + floating badges and shows the channel grid */
  function showPickerMode(channels) {
    socialBadges.style.display = 'none';
    iframe.style.display = 'none';
    picker.style.display = 'block';
    renderChannels(channels);

    var search = document.getElementById('search-input');
    search.addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      renderChannels(channels.filter(function (c) {
        return (c.name || '').toLowerCase().indexOf(q) !== -1 ||
               (c.category || '').toLowerCase().indexOf(q) !== -1;
      }));
    });
  }

  function renderChannels(channels) {
    var grid = document.getElementById('channel-grid');
    grid.innerHTML = '';

    if (!channels.length) {
      var empty = document.createElement('div');
      empty.className = 'no-results';
      empty.textContent = 'No channels found';
      grid.appendChild(empty);
      return;
    }

    var seen = new Set();

    channels.forEach(function (ch) {
      // de-duplicate by id (falls back to name when there is no id)
      var key = (ch.id !== undefined && ch.id !== null) ? String(ch.id) : (ch.name || '');
      if (!key || seen.has(key)) return;
      seen.add(key);

      var card = document.createElement('a');
      card.className = 'channel-card';
      card.href = '?id=' + encodeURIComponent(ch.id !== undefined ? ch.id : '');

      if (ch.logourl) {
        var img = document.createElement('img');
        img.className = 'channel-logo';
        img.src = ch.logourl;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function () {
          var dot = document.createElement('div');
          dot.className = 'channel-dot';
          if (img.parentNode) img.parentNode.replaceChild(dot, img);
        };
        card.appendChild(img);
      } else {
        var dot = document.createElement('div');
        dot.className = 'channel-dot';
        card.appendChild(dot);
      }

      var info = document.createElement('div');
      info.className = 'channel-info';

      var nameEl = document.createElement('div');
      nameEl.className = 'channel-name';
      nameEl.textContent = ch.name || 'Unnamed';
      info.appendChild(nameEl);

      if (ch.category) {
        var catEl = document.createElement('div');
        catEl.className = 'channel-cat';
        catEl.textContent = ch.category;
        info.appendChild(catEl);
      }

      card.appendChild(info);
      grid.appendChild(card);
    });
  }

  function showError(msg) {
    socialBadges.style.display = 'none';
    iframe.style.display = 'none';
    picker.style.display = 'none';
    var h2 = document.createElement('h2');
    h2.style.cssText = 'color:#fff;text-align:center;font-family:sans-serif;position:absolute;width:100%;top:50%;transform:translateY(-50%);padding:0 20px;';
    h2.textContent = msg;
    document.body.appendChild(h2);
  }

  function normalise(raw) {
    if (Array.isArray(raw)) return raw;
    if (!raw || typeof raw !== 'object') return [];
    if (Array.isArray(raw.iframes))  return raw.iframes;
    if (Array.isArray(raw.channels)) return raw.channels;
    if (Array.isArray(raw.data))     return raw.data;
    return [raw];
  }

  fetch(JSON_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (raw) {
      var list = normalise(raw);

      if (!id) {                       // ── no ?id → channel picker
        showPickerMode(list);
        return;
      }

      var targetData = list.find(function (item) {
        return String(item.id) === String(id);
      });

      if (targetData && targetData.iframeSrc) {
        // ── watch mode
        iframe.src = targetData.iframeSrc;

        if (targetData.hit) {
          // fire-and-forget view counter (no-cors avoids console errors)
          try {
            fetch(targetData.hit, { mode: 'no-cors', keepalive: true }).catch(function () {});
          } catch (e) { /* ignore */ }
        }

        // only nag for the Telegram channel when actually watching
        if (typeof window.showTelegramPopup === 'function') {
          window.showTelegramPopup();
        }
      } else {
        // unknown / incomplete id → fall back to the picker
        showPickerMode(list);
      }
    })
    .catch(function () {
      showError('Error loading channels');
    });
});
</script>

<!-- ====== TELEGRAM POPUP SCRIPT ====== -->
<script>
(function () {
  var TG_URL   = 'https://t.me/sportlink10';
  var tgOverlay = document.getElementById('tgOverlay');
  var hasId     = new URLSearchParams(window.location.search).get('id');
  var timer     = null;

  function closePopup() {
    tgOverlay.classList.remove('show');
  }

  function markSeen() {
    try { sessionStorage.setItem('tgPopupSeen', '1'); } catch (e) {}
  }

  function alreadySeen() {
    try { return sessionStorage.getItem('tgPopupSeen') === '1'; } catch (e) { return false; }
  }

  /* Called by the loader only once a stream is actually playing */
  window.showTelegramPopup = function () {
    if (!hasId || alreadySeen()) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      tgOverlay.classList.add('show');
    }, 3000);
  };

  document.getElementById('joinNow').addEventListener('click', function () {
    markSeen();
    window.open(TG_URL, '_blank', 'noopener');
    closePopup();
  });

  document.getElementById('joinedBtn').addEventListener('click', function () {
    markSeen();
    closePopup();
  });

  tgOverlay.addEventListener('click', function (e) {
    if (e.target === tgOverlay) closePopup();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && tgOverlay.classList.contains('show')) closePopup();
  });
})();
</script>
